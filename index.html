<title>Fernando Ghisi</title>

<style>
  :root {
    --bg: #FAFAF9;
    --ink: #1A1D23;
    --muted: #6B7280;
    --accent: #1F4B43;
    --line: #E5E4E0;
    --avatar-bg: #EFEDE8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 24px calc(48px + env(safe-area-inset-bottom, 0px));
  }

  main {
    width: 100%;
    max-width: 400px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: block;
    object-fit: cover;
    margin: 0 auto 28px;
    border: 1px solid var(--line);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.2;
    text-align: center;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  p.bio {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 40px;
    padding: 0 8px;
  }

  nav {
    border-top: 1px solid var(--line);
  }

  a.link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    transition: color 0.15s ease;
  }

  a.link-row:hover,
  a.link-row:focus-visible {
    color: var(--accent);
  }

  a.link-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .link-label {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--muted);
    transition: color 0.15s ease;
  }

  a.link-row:hover .link-icon,
  a.link-row:focus-visible .link-icon {
    color: var(--accent);
  }

  .link-handle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181C;
      --ink: #EDEDEC;
      --muted: #8A8F98;
      --accent: #5FBFA8;
      --line: #2B2E33;
      --avatar-bg: #1F2226;
    }
  }

  :root[data-theme="dark"] {
    --bg: #16181C;
    --ink: #EDEDEC;
    --muted: #8A8F98;
    --accent: #5FBFA8;
    --line: #2B2E33;
    --avatar-bg: #1F2226;
  }
</style>
</head>

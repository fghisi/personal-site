# Publica o site no Hostinger a cada push na main (ou manualmente pela aba Actions).
# Gera o site com o Eleventy e envia só o conteúdo de _site/ por FTP.
#
# Secrets do repositório (Settings > Secrets and variables > Actions):
#   FTP_SERVER    ex.: ftp.fghisi.com.br ou o IP mostrado no hPanel
#   FTP_USERNAME  usuário FTP do hPanel
#   FTP_PASSWORD  senha desse usuário
# Variável opcional:
#   FTP_DIR       pasta de destino no servidor (padrão: public_html/)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
